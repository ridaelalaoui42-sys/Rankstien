[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.build_meta"

[project]
name = "cli-anything-rankstein"
version = "1.0.0"
description = "Agent-native CLI for RankStein — Enterprise AI SEO Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "rich>=13.0.0",
]

[project.scripts]
cli-rankstein = "cli_anything_rankstein.__main__:main"

[tool.setuptools.packages.find]
include = ["cli_anything_rankstein*"]
