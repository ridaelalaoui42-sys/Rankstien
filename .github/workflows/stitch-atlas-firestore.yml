name: Stitch Atlas Firestore isolation emulator

on:
  pull_request:
    paths:
      - 'apps/stitch-atlas/firestore.rules'
      - 'apps/stitch-atlas/firebase.json'
      - 'apps/stitch-atlas/tests/firestore-emulator.test.mjs'
      - 'apps/stitch-atlas/package.json'
      - '.github/workflows/stitch-atlas-firestore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web SDK and Firebase Rules Testing
        working-directory: apps/stitch-atlas
        run: npm install --no-audit --no-fund
      - name: Run offline two-identity Firestore rules emulator suite
        working-directory: apps/stitch-atlas
        run: npx --yes firebase-tools@14.27.0 emulators:exec --project demo-stitch-atlas-rules --only firestore 'npm run test:firestore'
