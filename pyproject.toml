[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [
    "archive/",
    "scripts/oneoff/",
    "frontend/",
    "Pinterest_Growth_Agent_core_.*",
    "data/",
    "venv/",
    ".venv/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: fast, no I/O, no network",
    "integration: hits real Supabase / filesystem; slower",
    "e2e: full pipeline; may hit Pinterest; off by default",
]

[tool.coverage.run]
source = ["pinterest_automation", "backend"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "archive/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
