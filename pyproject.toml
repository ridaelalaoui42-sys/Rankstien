[project]
name = "rankstein"
version = "0.1.0"
description = "Autonomous AI SEO content engine for recetadolce.com"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "archive",
    "scripts/oneoff",
    "scratch",                      # transient debug helpers
    "frontend/node_modules",
    "frontend/.graphify_temp_corpus",
    "frontend/graphify-out",
    "frontend/output",
    "frontend/nanobanana-output",
    "frontend/scripts",
    "frontend/*.py",
    "Pinterest_Growth_Agent_core_repo",
    "Pinterest_Growth_Agent_core_tmp",
    "projets",
    "data",
    "venv",
    ".venv",
    "voxcpm_venv",
    "rankstein/condescending-bohr-4d2c28",

    # Root-level operational/debug scripts are local runbooks, not CI-owned
    # package code. Keep real application code under rankstein/, backend/,
    # pinterest_automation/, scripts/dev/, and tests/ linted.
    "audit_*.py",
    "check_*.py",
    "cloudinary_upload.py",
    "build_*.py",
    "create_and_publish_article.py",
    "create_article_*.py",
    "debug_*.py",
    "dedup_jobs.py",
    "dump_*.py",
    "enqueue_pin.py",
    "expand_article.py",
    "fetch_*.py",
    "find_*.py",
    "fix_*.py",
    "force_publish.py",
    "generate_pin.py",
    "init_storage.py",
    "list_all_slugs.py",
    "isolate_*.py",
    "log_*.py",
    "manual_*.py",
    "minify_*.py",
    "orchestrate_*.py",
    "prep_and_fix.py",
    "publish_*.py",
    "recover_social.py",
    "remaster_backlog.py",
    "rebrand_script.py",
    "reset_jobs.py",
    "revert_to_*.py",
    "setup_*.py",
    "show_*.py",
    "switch_to_*.py",
    "target_*.py",
    "temp_upload.py",
    "test_*.py",
    "upload_*.py",
    "rankstein_mcp_server_v2.py",
    "scripts/debug",
    "scripts/adsense_audit.py",
    "scripts/adsense_repair.py",
    "social_siphon_orchestrator.py",

    # Legacy backend one-offs kept for manual operations.
    "backend/scripts/dual_turbo.py",
    "backend/scripts/fix_post.py",
    "backend/scripts/turbo_articles.py",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async correctness
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # line too long (formatter handles)
    "S101",   # assert (allowed in tests)
    "S603",   # subprocess without shell=True (intentional)
    "S607",   # partial executable path (we use system tools)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]   # assert + hardcoded passwords + tmp paths (test fixtures)
"scripts/**/*.py" = ["S", "E402", "B007", "E722"]    # one-off scripts can be loose
"publish_single.py" = ["E722"]                       # legacy single-file publisher
"remaster_backlog.py" = ["ASYNC230"]                  # legacy root-level helper

# Root-level operational helpers — short SQL-tooling scripts that touch
# data/, queue, sessions. Same loose-rules treatment as scripts/.
"check_*.py" = ["S", "E402", "B007", "E722", "F841", "W291", "W293"]
"dedup_jobs.py" = ["S", "B007", "E722", "F841"]
"prep_and_fix.py" = ["S", "B007", "E722", "S112"]
"recover_social.py" = ["S", "E722", "S112", "W291", "RUF001"]
"rescue_dlq.py" = ["S", "B007", "E722"]
"reset_jobs.py" = ["S", "E722"]
"fix_env.py" = ["S", "E722"]
"test_browser_launch.py" = ["S", "E722"]
"identify_accounts.py" = ["S", "E402", "E722"]
"import_articles_to_keywords.py" = ["S", "E402", "E722", "W293"]
"process_backlog_batch.py" = ["S", "E402", "E722"]
